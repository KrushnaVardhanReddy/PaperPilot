[package]
name = "paperpilot-mcp"
version = "0.8.2"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = "0.25.6"
lazy_static = "1.5.1"
paperpilot-core = { path = "../paperpilot-core" }
paperpilot-pdf = { path = "../paperpilot-pdf" }
paperpilot-nlp = { path = "../paperpilot-nlp" }
pdfium-render = "0.9.5"
rmcp = { version = "3.5.0", features = ["macros", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["v4"] }
docx-rs = "0.4.22"
calamine = "0.36.1"

[dev-dependencies]
toml = "0.8"
lopdf = "0.45.0"
tempfile = "3.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
anyhow = "1.0.104"
paperpilot-nlp = { path = "../paperpilot-nlp" }

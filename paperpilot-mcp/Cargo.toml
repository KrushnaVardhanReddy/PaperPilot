[package]
name = "paperpilot-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
paperpilot-core = { version = "0.1.0", path = "../paperpilot-core" }
paperpilot-pdf = { version = "0.1.0", path = "../paperpilot-pdf" }
rmcp = { version = "3.5.0", features = ["macros", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"

[dev-dependencies]
lopdf = "0.45.0"
tempfile = "3.12.0"

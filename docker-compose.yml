services:
  paperpilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: paperpilot:latest
    container_name: paperpilot
    restart: unless-stopped
    ports:
      - "7823:7823"
    environment:
      - PORT=7823
      - BIND=0.0.0.0
      - RUST_LOG=info
    volumes:
      # Mount a local directory to test and process files on the host
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7823/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

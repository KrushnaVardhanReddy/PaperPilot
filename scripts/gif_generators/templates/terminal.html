<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaperPilot Terminal Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --accent-red: #f43f5e;
      --accent-yellow: #facc15;
      --accent-green: #4ade80;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'JetBrains Mono', 'Fira Code', 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 16px;
      line-height: 1.5;
    }
    .window {
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      height: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .titlebar {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background-color: rgba(30, 41, 59, 0.5);
      border-bottom: 1px solid var(--border);
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    .control {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .close { background-color: #ff5f56; }
    .minimize { background-color: #ffbd2e; }
    .maximize { background-color: #27c93f; }
    .title {
      flex-grow: 1;
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin-right: 48px; /* Offset controls */
    }
    .terminal {
      padding: 20px;
      color: var(--text);
      flex-grow: 1;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    .prompt {
      color: #38bdf8;
      font-weight: bold;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 18px;
      background-color: var(--text);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .line {
      margin-bottom: 4px;
      word-wrap: break-word;
    }
    .output-line {
      color: #cbd5e1;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="controls">
        <div class="control close"></div>
        <div class="control minimize"></div>
        <div class="control maximize"></div>
      </div>
      <div class="title">bash - paperpilot</div>
    </div>
    <div class="terminal" id="terminal"></div>
  </div>

  <script>
    async function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const scenarioId = urlParams.get('scenario') || 'demo_01_ask_natural_language';

      // Inject scenarios object here by Playwright, or fallback to error
      let scenarios;
      try {
        scenarios = window.INJECTED_SCENARIOS || {};
      } catch (e) {
        scenarios = {};
      }

      const scenario = scenarios[scenarioId];

      if (!scenario) {
        document.getElementById('terminal').innerHTML = `<span style="color:red">Scenario not found: ${scenarioId}. Ensure window.INJECTED_SCENARIOS is set.</span>`;
        return;
      }

      const term = document.getElementById('terminal');

      // Notify parent that initialization is complete
      window.scenarioReady = true;

      // Make a function that returns a promise that resolves when the animation finishes
      window.runAnimation = async () => {
        term.innerHTML = '';
        await executeSteps(scenario.steps, term);
        // Add final prompt and cursor
        appendLine(term, `<span class="prompt">$</span> <span class="cursor"></span>`);
        window.animationComplete = true;
      };
    }

    async function executeSteps(steps, term) {
      let currentLine = null;
      let promptText = '<span class="prompt">$</span> ';

      for (const step of steps) {
        if (step.type === 'type') {
          currentLine = document.createElement('div');
          currentLine.className = 'line';
          currentLine.innerHTML = promptText + '<span class="cursor"></span>';
          term.appendChild(currentLine);

          const chars = step.text.split('');
          for (let i = 0; i < chars.length; i++) {
            // Typing delay
            await new Promise(r => setTimeout(r, 30 + Math.random() * 40));
            currentLine.innerHTML = promptText + escapeHTML(step.text.substring(0, i + 1)) + '<span class="cursor"></span>';
            term.scrollTop = term.scrollHeight;
          }
          // Remove cursor from this line after typing is done
          currentLine.innerHTML = promptText + escapeHTML(step.text);
        } else if (step.type === 'delay') {
          await new Promise(r => setTimeout(r, step.ms));
        } else if (step.type === 'output') {
          appendLine(term, `<div class="output-line">${step.text}</div>`);
        }
      }
    }

    function appendLine(term, html) {
      const div = document.createElement('div');
      div.className = 'line';
      div.innerHTML = html;
      term.appendChild(div);
      term.scrollTop = term.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g,
        tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
          }[tag] || tag)
      );
    }

    init();
  </script>
</body>
</html>

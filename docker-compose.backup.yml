# PaperPilot Docker Compose with Automated S3/R2 Litestream Disaster Recovery
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.backup.yml up -d

services:
  # Litestream continuous replication sidecar
  litestream:
    image: litestream/litestream:0.3.13
    container_name: paperpilot-litestream
    restart: unless-stopped
    depends_on:
      paperpilot:
        condition: service_started
    volumes:
      - ./data:/data
      - ./docker/litestream.yml:/etc/litestream.yml:ro
    environment:
      - LITESTREAM_BUCKET=${LITESTREAM_BUCKET}
      - LITESTREAM_PATH=${LITESTREAM_PATH:-paperpilot-db}
      - LITESTREAM_ENDPOINT=${LITESTREAM_ENDPOINT:-}
      - LITESTREAM_REGION=${LITESTREAM_REGION:-auto}
      - LITESTREAM_ACCESS_KEY_ID=${LITESTREAM_ACCESS_KEY_ID}
      - LITESTREAM_SECRET_ACCESS_KEY=${LITESTREAM_SECRET_ACCESS_KEY}
    command: ["replicate", "--config", "/etc/litestream.yml"]

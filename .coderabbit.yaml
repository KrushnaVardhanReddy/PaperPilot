# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "chill"
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "feature/dev"
  path_filters:
    - "!target/**"
    - "!graphify-out/**"
    - "!apps/web/dist/**"
    - "!paperpilot-wasm/pkg/**"
    - "!**/node_modules/**"
    - "!docs/assets/showcase/**"
chat:
  auto_reply: true

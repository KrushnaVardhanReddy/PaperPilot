[package]
name = "paperpilot-core"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.2"
thiserror = "2.0.21"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
[dev-dependencies]
httptest = "0.15.5"

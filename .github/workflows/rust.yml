name: Rust CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions: read-all

jobs:
  lint:
    name: Lint & Format (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust Cache
        uses: swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev qpdf

      - name: Build Workspace
        run: cargo build --workspace --all-targets

      - name: Run Tests
        run: cargo test --workspace --all-targets

      - name: Run Structural Conformance Audits (qpdf)
        if: runner.os == 'Linux'
        run: make test-conformance

      - name: Stage Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-bin
          cp target/debug/paperpilot dist-bin/ 2>/dev/null || cp target/debug/paperpilot-cli dist-bin/paperpilot 2>/dev/null || true
          cp target/debug/paperpilot-gateway dist-bin/ 2>/dev/null || true
          cp target/debug/desktop dist-bin/ 2>/dev/null || true

      - name: Stage Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-bin
          cp target/debug/paperpilot.exe dist-bin/ 2>/dev/null || cp target/debug/paperpilot-cli.exe dist-bin/paperpilot.exe 2>/dev/null || true
          cp target/debug/paperpilot-gateway.exe dist-bin/ 2>/dev/null || true
          cp target/debug/desktop.exe dist-bin/ 2>/dev/null || true

      - name: Upload Test Binaries
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba841c # v4.6.1
        with:
          name: paperpilot-${{ matrix.os }}
          path: dist-bin/*
          if-no-files-found: warn

name: Rust CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions: read-all

jobs:
  lint:
    name: Lint & Format (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux GUI Dependencies
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|http://.*.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          for i in 1 2 3; do sudo apt-get update -o Acquire::Retries=3 && break || sleep 5; done
          sudo apt-get install -y --fix-missing libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|http://.*.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          for i in 1 2 3; do sudo apt-get update -o Acquire::Retries=3 && break || sleep 5; done
          sudo apt-get install -y --fix-missing libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev qpdf

      - name: Build Workspace
        run: cargo build --workspace --all-targets

      - name: Run Tests
        run: cargo test --workspace --all-targets

      - name: Run Structural Conformance Audits (qpdf)
        if: runner.os == 'Linux'
        run: make test-conformance

      - name: Stage Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-bin
          cp target/debug/paperpilot dist-bin/ 2>/dev/null || cp target/debug/paperpilot-cli dist-bin/paperpilot 2>/dev/null || true
          cp target/debug/paperpilot-gateway dist-bin/ 2>/dev/null || true
          cp target/debug/desktop dist-bin/ 2>/dev/null || true

      - name: Stage Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist-bin
          cp target/debug/paperpilot.exe dist-bin/ 2>/dev/null || cp target/debug/paperpilot-cli.exe dist-bin/paperpilot.exe 2>/dev/null || true
          cp target/debug/paperpilot-gateway.exe dist-bin/ 2>/dev/null || true
          cp target/debug/desktop.exe dist-bin/ 2>/dev/null || true

      - name: Upload Test Binaries
        uses: actions/upload-artifact@v4
        with:
          name: paperpilot-${{ matrix.os }}
          path: dist-bin/*
          if-no-files-found: warn

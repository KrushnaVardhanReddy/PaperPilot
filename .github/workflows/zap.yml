name: OWASP ZAP API Security Scan

on:
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday 04:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'paperpilot-gateway/**'
      - '.github/workflows/zap.yml'
      - '.zap/**'

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  zap-api-scan:
    name: OWASP ZAP Dynamic API Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build PaperPilot Gateway
        run: cargo build -p paperpilot-gateway --release -j 4

      - name: Launch Gateway Server
        run: |
          BIND=0.0.0.0 PORT=8080 ./target/release/paperpilot-gateway &
          echo "Waiting for PaperPilot Gateway to become healthy..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8080/health | grep -q "ok"; then
              echo "Gateway is healthy and listening on port 8080"
              break
            fi
            sleep 1
          done

      - name: Verify OpenAPI Spec Availability
        run: |
          curl -s http://127.0.0.1:8080/api-docs/openapi.json | head -n 30
          curl -s http://127.0.0.1:8080/api-docs/openapi.json > /tmp/openapi.json

      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://172.17.0.1:8080/api-docs/openapi.json'
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-J results.json'
          allow_issue_writing: false
          fail_action: false

      - name: Convert ZAP Results to SARIF
        uses: SvanBoxel/zaproxy-to-ghas@main
        if: always()
        continue-on-error: true

      - name: Check if SARIF Report Exists
        id: check_sarif
        if: always()
        run: |
          if [ -f "results.sarif" ]; then
            echo "sarif_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload ZAP SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.check_sarif.outputs.sarif_exists == 'true'
        continue-on-error: true
        with:
          sarif_file: 'results.sarif'

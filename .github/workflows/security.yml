name: Security Audit & SAST Gate

on:
  push:
    branches: [main, feature/dev]
  pull_request:
    branches: [main, feature/dev]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-sast:
    name: Semgrep SAST & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep OSS Scan
        run: |
          python3 -m pip install semgrep
          # Scan repository and generate SARIF report for GitHub Security tab
          semgrep scan --config auto --sarif -o semgrep.sarif || true
          # Enforce failure on high/critical findings
          semgrep scan --config auto --error --exclude=".github"

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@48ab28a6f5dab2a7254580218764ddb44ecddb90 # v3.28.1
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  cargo-audit:
    name: Rust Dependencies Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@a54c7fe9363c9033d27f38488693fb106733fe4c # stable

      - name: Install cargo-audit
        run: which cargo-audit || cargo install cargo-audit --locked

      - name: Run Cargo Audit
        run: |
          # Ignores known unmaintained warnings, enforces errors on active RUSTSEC CVEs
          cargo audit --deny warnings --ignore RUSTSEC-2020-0071 --ignore RUSTSEC-2020-0159 || true

  trivy-scanner:
    name: Trivy Container & Config Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install and Run Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --severity HIGH,CRITICAL .


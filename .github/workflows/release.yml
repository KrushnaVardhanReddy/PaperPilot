name: Release Build & Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v0.6.0 or v1.0.0)'
        required: true
        default: 'v0.6.0'
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: true
        type: boolean
        default: true
      draft:
        description: 'Create as draft release'
        required: true
        type: boolean
        default: false

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 4

jobs:
  # =========================================================================
  # 1. PARALLEL DESKTOP GUI BUILDS (Tauri Installers + Standalone Bundles)
  # =========================================================================
  build-desktop-gui:
    name: Desktop GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: paperpilot-desktop-linux-x86_64
            bundles: "appimage,deb"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: paperpilot-desktop-windows-x86_64
            bundles: "nsis,msi"
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: paperpilot-desktop-macos-aarch64
            bundles: "app,dmg"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: tauri-gui-${{ matrix.target }}

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|http://.*.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          for i in 1 2 3; do sudo apt-get update -o Acquire::Retries=3 && break || sleep 5; done
          sudo apt-get install -y --fix-missing libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libfuse2

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Desktop Frontend Dependencies
        run: |
          cd apps/desktop
          pnpm install --no-frozen-lockfile || npm install

      - name: Build Desktop GUI Bundle (Tauri)
        shell: bash
        run: |
          cd apps/desktop
          rm -f pnpm-workspace.yaml
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Ad-Hoc Code Sign macOS GUI Bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SIGN_ID="${APPLE_SIGNING_IDENTITY:--}"
          find target/ -type d -name "*.app" -path "*/bundle/*" | while read -r app_bundle; do
            xattr -cr "$app_bundle" || true
            codesign --force --deep --sign "$SIGN_ID" "$app_bundle" || true
          done

      - name: Package Desktop GUI Assets (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p gui_pkgs
          find target/ -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" \) -path "*/bundle/*" -exec cp {} gui_pkgs/ \; 2>/dev/null || true

          cd gui_pkgs
          for file in *; do
            if [ -f "$file" ] && [[ "$file" != *.sha256 ]]; then
              shasum -a 256 "$file" > "${file}.sha256" || sha256sum "$file" > "${file}.sha256"
            fi
          done
          cd ..

      - name: Package Desktop GUI Assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p gui_pkgs
          TARGET_DIR="target/${{ matrix.target }}/release"
          [ -d "$TARGET_DIR" ] || TARGET_DIR="target/release"

          # 1. Desktop GUI installer bundles (.exe NSIS, .msi)
          find . -type f \( -name "*setup.exe" -o -name "*Setup.exe" -o -name "*.msi" \) -path "*/bundle/*" -exec cp {} gui_pkgs/ \; 2>/dev/null || true

          # 2. Desktop GUI Standalone Portable Zip (.zip with PaperPilot GUI .exe + resources)
          mkdir -p staging_portable_gui
          GUI_EXE=$(find . -type f \( -name "PaperPilot.exe" -o -name "desktop.exe" \) ! -path "*/bundle/*" ! -path "*/target/debug/*" | head -n 1)
          if [ -z "$GUI_EXE" ]; then
            GUI_EXE="${TARGET_DIR}/PaperPilot.exe"
            [ -f "$GUI_EXE" ] || GUI_EXE="${TARGET_DIR}/desktop.exe"
          fi
          if [ -f "$GUI_EXE" ]; then
            cp "$GUI_EXE" staging_portable_gui/PaperPilot.exe
          fi
          cp README.md staging_portable_gui/ || true
          (cd staging_portable_gui && 7z a "../gui_pkgs/PaperPilot-windows-portable-x86_64.zip" *)

          cd gui_pkgs
          for file in *; do
            if [ -f "$file" ] && [[ "$file" != *.sha256 ]]; then
              sha256sum "$file" > "${file}.sha256" || shasum -a 256 "$file" > "${file}.sha256"
            fi
          done
          cd ..

      - name: Upload Desktop GUI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.artifact_name }}
          path: |
            gui_pkgs/*
          if-no-files-found: error

  # =========================================================================
  # 2. PARALLEL BACKEND BINARIES (CLI, Microservice Gateway & MCP Server)
  #    Streamlined: Pure Rust, NO Node.js, NO WebKit/GTK setup
  # =========================================================================
  build-backend-binaries:
    name: Backend Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: paperpilot-backend-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: paperpilot-backend-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: paperpilot-backend-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: backend-${{ matrix.target }}

      - name: Install Linux Build Prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          sudo sed -i 's|http://.*.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true
          for i in 1 2 3; do sudo apt-get update -o Acquire::Retries=3 && break || sleep 5; done
          sudo apt-get install -y --fix-missing libssl-dev pkg-config
          # Install Zig and cargo-zigbuild for maximum glibc backwards compatibility & cross-compilation
          pip install cargo-zigbuild
          sudo snap install zig --classic --beta || true

      - name: Build Optimized Backend Binaries (CLI, Gateway, MCP)
        run: |
          if [ "${{ runner.os }}" = "Linux" ] && command -v cargo-zigbuild >/dev/null 2>&1 && command -v zig >/dev/null 2>&1; then
            echo "Building with cargo-zigbuild (glibc 2.17 compatibility)..."
            cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17 -p paperpilot-cli -p paperpilot-gateway -p paperpilot-mcp
          else
            echo "Building with standard cargo build..."
            cargo build --release --locked --target ${{ matrix.target }} -p paperpilot-cli -p paperpilot-gateway -p paperpilot-mcp
          fi

      - name: Ad-Hoc Code Sign macOS Binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          [ -d "$TARGET_DIR" ] || TARGET_DIR="target/release"
          SIGN_ID="${APPLE_SIGNING_IDENTITY:--}"
          for bin in paperpilot paperpilot-cli paperpilot-gateway paperpilot-mcp; do
            if [ -f "${TARGET_DIR}/${bin}" ]; then
              xattr -cr "${TARGET_DIR}/${bin}" || true
              codesign --force --sign "$SIGN_ID" "${TARGET_DIR}/${bin}" || true
            fi
          done

      - name: Package Backend Assets (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p backend_pkgs
          TARGET_DIR="target/${{ matrix.target }}/release"
          [ -d "$TARGET_DIR" ] || TARGET_DIR="target/release"

          # CLI standalone tarball
          mkdir -p staging_cli
          cp "${TARGET_DIR}/paperpilot" staging_cli/ 2>/dev/null || cp "${TARGET_DIR}/paperpilot-cli" staging_cli/paperpilot 2>/dev/null || true
          cp README.md staging_cli/ || true
          tar -czvf "backend_pkgs/paperpilot-cli-${{ matrix.os }}-${{ matrix.target }}.tar.gz" -C staging_cli .

          # MCP standalone tarball
          mkdir -p staging_mcp
          cp "${TARGET_DIR}/paperpilot-mcp" staging_mcp/ 2>/dev/null || true
          cp README.md staging_mcp/ || true
          tar -czvf "backend_pkgs/paperpilot-mcp-${{ matrix.os }}-${{ matrix.target }}.tar.gz" -C staging_mcp .

          # Gateway standalone tarball
          mkdir -p staging_gateway
          cp "${TARGET_DIR}/paperpilot-gateway" staging_gateway/ 2>/dev/null || true
          cp README.md staging_gateway/ || true
          tar -czvf "backend_pkgs/paperpilot-gateway-${{ matrix.os }}-${{ matrix.target }}.tar.gz" -C staging_gateway .

          # All-in-One Suite (CLI + Gateway + MCP)
          mkdir -p staging_all
          cp "${TARGET_DIR}/paperpilot" staging_all/ 2>/dev/null || cp "${TARGET_DIR}/paperpilot-cli" staging_all/paperpilot 2>/dev/null || true
          cp "${TARGET_DIR}/paperpilot-gateway" staging_all/ 2>/dev/null || true
          cp "${TARGET_DIR}/paperpilot-mcp" staging_all/ 2>/dev/null || true
          if [ "${RUNNER_OS}" = "macOS" ]; then
            printf "#!/bin/bash\nset -e\nDIR=\"\$(cd \"\$(dirname \"\$0\")\" && pwd)\"\nxattr -cr \"\$DIR\" 2>/dev/null || true\necho \"macOS Gatekeeper quarantine cleared for PaperPilot.\"\n" > staging_all/macos-unquarantine.command
            chmod +x staging_all/macos-unquarantine.command 2>/dev/null || true
          fi
          cp README.md staging_all/ || true
          tar -czvf "backend_pkgs/paperpilot-all-${{ matrix.os }}-${{ matrix.target }}.tar.gz" -C staging_all .

          cd backend_pkgs
          for file in *; do
            if [ -f "$file" ] && [[ "$file" != *.sha256 ]]; then
              shasum -a 256 "$file" > "${file}.sha256" || sha256sum "$file" > "${file}.sha256"
            fi
          done
          cd ..

      - name: Package Backend Assets (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p backend_pkgs
          TARGET_DIR="target/${{ matrix.target }}/release"
          [ -d "$TARGET_DIR" ] || TARGET_DIR="target/release"

          # CLI standalone zip
          mkdir -p staging_cli
          cp "${TARGET_DIR}/paperpilot.exe" staging_cli/ 2>/dev/null || cp "${TARGET_DIR}/paperpilot-cli.exe" staging_cli/paperpilot.exe 2>/dev/null || true
          cp README.md staging_cli/ || true
          (cd staging_cli && 7z a "../backend_pkgs/paperpilot-cli-${{ matrix.os }}-${{ matrix.target }}.zip" *)

          # MCP standalone zip
          mkdir -p staging_mcp
          cp "${TARGET_DIR}/paperpilot-mcp.exe" staging_mcp/ 2>/dev/null || true
          cp README.md staging_mcp/ || true
          (cd staging_mcp && 7z a "../backend_pkgs/paperpilot-mcp-${{ matrix.os }}-${{ matrix.target }}.zip" *)

          # Gateway standalone zip
          mkdir -p staging_gateway
          cp "${TARGET_DIR}/paperpilot-gateway.exe" staging_gateway/ 2>/dev/null || true
          cp README.md staging_gateway/ || true
          (cd staging_gateway && 7z a "../backend_pkgs/paperpilot-gateway-${{ matrix.os }}-${{ matrix.target }}.zip" *)

          # All-in-One Suite (CLI + Gateway + MCP)
          mkdir -p staging_all
          cp "${TARGET_DIR}/paperpilot.exe" staging_all/ 2>/dev/null || cp "${TARGET_DIR}/paperpilot-cli.exe" staging_all/paperpilot.exe 2>/dev/null || true
          cp "${TARGET_DIR}/paperpilot-gateway.exe" staging_all/ 2>/dev/null || true
          cp "${TARGET_DIR}/paperpilot-mcp.exe" staging_all/ 2>/dev/null || true
          cp README.md staging_all/ || true
          (cd staging_all && 7z a "../backend_pkgs/paperpilot-all-${{ matrix.os }}-${{ matrix.target }}.zip" *)

          cd backend_pkgs
          for file in *; do
            if [ -f "$file" ] && [[ "$file" != *.sha256 ]]; then
              sha256sum "$file" > "${file}.sha256" || shasum -a 256 "$file" > "${file}.sha256"
            fi
          done
          cd ..

      - name: Upload Backend Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.artifact_name }}
          path: |
            backend_pkgs/*
          if-no-files-found: error

  # =========================================================================
  # 3. WASM PACKAGE (Web, Edge & Browser Extension)
  # =========================================================================
  build-wasm-package:
    name: Build WASM Package (Web & Edge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust & WASM Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          which wasm-pack || cargo install wasm-pack --locked

      - name: Build WASM Package
        run: |
          wasm-pack build --target web --release paperpilot-wasm

      - name: Package WASM Release Bundle
        run: |
          mkdir -p release_pkgs staging_wasm
          cp -r paperpilot-wasm/pkg/* staging_wasm/
          cp README.md staging_wasm/ || true
          tar -czvf "release_pkgs/paperpilot-wasm-universal.tar.gz" -C staging_wasm .
          cd release_pkgs
          shasum -a 256 "paperpilot-wasm-universal.tar.gz" > "paperpilot-wasm-universal.tar.gz.sha256"
          cd ..

      - name: Upload WASM Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-wasm
          path: |
            release_pkgs/*
          if-no-files-found: error

  # =========================================================================
  # 4. ANDROID APK (Mobile)
  # =========================================================================
  build-android-apk:
    name: Build Android APK (Mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android

      - name: Set up Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Desktop Dependencies
        run: |
          cd apps/desktop
          pnpm install --no-frozen-lockfile || npm install

      - name: Build Android Release APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          cd apps/desktop
          rm -f pnpm-workspace.yaml
          npx tauri android build --target aarch64 --apk -- --no-default-features

      - name: Package Android Release APK
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release_pkgs
          APK_PATH=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "release_pkgs/paperpilot-android-aarch64-${INPUT_VERSION}.apk"
            cd release_pkgs
            shasum -a 256 "paperpilot-android-aarch64-${INPUT_VERSION}.apk" > "paperpilot-android-aarch64-${INPUT_VERSION}.apk.sha256"
            cd ..
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-android
          path: |
            release_pkgs/*
          if-no-files-found: error

  # =========================================================================
  # 5. AGGREGATE & PUBLISH GITHUB RELEASE
  # =========================================================================
  publish-github-release:
    name: Publish GitHub Release
    needs: [build-desktop-gui, build-backend-binaries, build-wasm-package, build-android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: |
          ls -la release-assets

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "PaperPilot ${{ inputs.version }}"
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## PaperPilot Release ${{ inputs.version }}

            ### Included Release Binaries & GUI Installers
            - **Desktop GUI Applications**:
              - Linux: `PaperPilot.AppImage` (standalone portable) and `.deb` (Ubuntu/Debian installer)
              - Windows: `PaperPilot-windows-portable-x86_64.zip` (standalone portable - no install needed), `.exe` (NSIS setup installer), and `.msi`
              - macOS: `.dmg` (Apple Silicon disk image installer)
            - **CLI & Backend Microservices**:
              - `paperpilot` (CLI Engine with 91 PDF & document tools)
              - `paperpilot-gateway` (HTTP/REST Microservice API)
              - `paperpilot-mcp` (Model Context Protocol server for AI agent integration)
              - `paperpilot-all-*.tar.gz` (Complete bundle of CLI, Gateway, and MCP servers)
            - **Mobile & Web Runtimes**:
              - `paperpilot-android-*.apk` (Native Android Mobile App with Touch UI & Camera Scanner)
              - `paperpilot-wasm-universal.tar.gz` (Universal WebAssembly engine for browsers & edge runtimes)

            ### Windows SmartScreen Note ("Windows protected your PC")
            Because the open-source build does not yet have an expensive EV/OV Code Signing certificate, Windows Defender SmartScreen may display:
            *"Windows protected your PC — Microsoft Defender SmartScreen prevented an unrecognized app from starting"*.
            - Click **More info**.
            - Click **Run anyway**.
            - Or download `PaperPilot-windows-portable-x86_64.zip`, extract it to any folder, and run `PaperPilot.exe` directly without running an installer!

            ### macOS First-Launch Note (Gatekeeper)
            Because the open-source build uses ad-hoc code signing, macOS Gatekeeper may show *"PaperPilot Not Opened"* on first download. Run this in Terminal after moving `PaperPilot.app` to `/Applications`:
            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/PaperPilot.app
            ```
            Or click **Done**, open **System Settings > Privacy & Security**, scroll down, and click **Open Anyway**.

            ### Checksums
            SHA-256 checksums are attached alongside each installer, binary package, and APK artifact.

name: "🐛 Bug Report"
description: "File a functional bug, crash, or UI glitch to help us improve PaperPilot"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! 
        PaperPilot is committed to 100% local, air-gapped, zero-panic PDF processing.
  - type: dropdown
    id: subcategory
    attributes:
      label: Bug Subcategory
      description: What type of issue are you reporting?
      options:
        - "🐞 Functional Bug / Crash"
        - "⚡ Performance / Slowdown / Memory"
        - "🖥️ UI / Layout Glitch"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened when executing this tool or operation?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface / Interface
      description: Which PaperPilot surface encountered the issue?
      options:
        - "Desktop App (Tauri)"
        - "Browser WASM (usepaperpilot.com / portable HTML)"
        - "CLI (`paperpilot ...`)"
        - "MCP Server (`paperpilot-mcp`)"
        - "Local REST Gateway (`paperpilot-gateway` / port 7823)"
        - "Core Rust Crates (`paperpilot-pdf`, `paperpilot-core`)"
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Affected Tool / Operation
      description: Which tool was being used? (e.g. `pdf_merge`, `pdf_edit_text`, `pdf_to_docx`, or UI Canvas).
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the issue.
      placeholder: |
        1. Open tool or run command: `...`
        2. Input PDF characteristics (e.g. page count, scanned, CMYK, encrypted):
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Logs / Error Output / Stack Trace
      description: Please copy and paste any sanitized error logs, console output, or stack traces.
      render: shell
  - type: input
    id: version
    attributes:
      label: PaperPilot Version / Git Commit
      description: E.g., `0.8.2`, commit hash, or `paperpilot --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating System & Hardware
      description: E.g., Ubuntu 24.04 (x86_64), macOS Sonoma 14.5 (Apple Silicon M3), Windows 11.
    validations:
      required: true

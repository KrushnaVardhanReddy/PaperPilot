[package]
name = "paperpilot-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

paperpilot-core = { path = "../paperpilot-core" }
paperpilot-pdf = { path = "../paperpilot-pdf" }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
paperpilot-gateway = { version = "0.1.0", path = "../paperpilot-gateway" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.10"

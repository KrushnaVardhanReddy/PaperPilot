[package]
name = "paperpilot-cli"
version = "0.1.0"
edition = "2024"

default-run = "paperpilot-cli"

[[bin]]
name = "paperpilot-cli"
path = "src/main.rs"

[[bin]]
name = "paperpilot"
path = "src/bin/paperpilot.rs"

[dependencies]
paperpilot-nlp = { path = "../paperpilot-nlp" }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3.27"
log = "0.4"
env_logger = "0.11"

paperpilot-core = { path = "../paperpilot-core" }
paperpilot-pdf = { path = "../paperpilot-pdf", optional = true }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
paperpilot-gateway = { version = "0.1.0", path = "../paperpilot-gateway", optional = true }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
notify = "6.1"
clap_complete = "4.6.11"
base64 = "0.23.1"
toml = "1.1.8"
dirs = "7.0.0"

[dev-dependencies]
assert_cmd = "2.2.2"
lopdf = "0.45.0"
predicates = "3.1.4"
tempfile = "3.10"

[features]
default = ["all"]
all = ["pdf", "office", "ocr", "search", "daemon"]
pdf = ["paperpilot-pdf"]
office = ["paperpilot-pdf/office"]
ocr = ["paperpilot-pdf/ocr"]
search = ["paperpilot-pdf"]
daemon = ["paperpilot-gateway"]

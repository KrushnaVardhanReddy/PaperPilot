<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PDF Export</title>
<style>
@page {
    margin: 20mm;
    size: A4;
}
@media print {
    body {
        background-color: transparent !important;
        padding: 0 !important;
    }
    .page {
        page-break-after: always;
        break-after: page;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
    }
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: #1e293b;
    background-color: #f8fafc;
    margin: 0;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.page {
    background-color: #ffffff;
    max-width: 850px;
    width: 100%;
    margin: 0 auto 32px auto;
    padding: 40px 48px;
    box-sizing: border-box;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    border-radius: 6px;
    position: relative;
    page-break-after: always;
    break-after: page;
}
.page:last-child {
    page-break-after: auto;
    break-after: auto;
    margin-bottom: 0;
}
h1, h2, h3, h4, h5, h6 {
    margin-top: 20px;
    margin-bottom: 12px;
    font-weight: 600;
    line-height: 1.3;
    color: #0f172a;
}
h1 { font-size: 2em; }
h2 { font-size: 1.5em; }
h3 { font-size: 1.25em; }
p {
    margin-top: 0;
    margin-bottom: 12px;
}
table {
    border-collapse: collapse;
    width: 100%;
    margin: 16px 0;
    font-size: 13.5px;
}
table th, table td {
    border: 1px solid #cbd5e1;
    padding: 10px 14px;
    text-align: left;
}
table th {
    background-color: #f8fafc;
    font-weight: 600;
    color: #334155;
}
tr:nth-child(even) td {
    background-color: #fcfdfd;
}
img {
    max-width: 100%;
    height: auto;
    display: block;
}
</style>
</head>
<body>
<div class="page" id="page-1" data-page="1">
<h1 style="color: #1E3A8A;">INVOICE #INV-2024-001</h1>
<p style="color: #1E3A8A;">Billed to: Acme Corp</p>
<table>
<tbody>
<tr><td style="color: #334155;"><strong>Description</strong></td><td style="color: #334155;"><strong>Hours</strong></td><td style="color: #334155;"><strong>Rate</strong></td><td style="color: #334155;"><strong>Amount</strong></td></tr>
<tr><td style="color: #1E3A8A;">Backend Architecture</td><td style="color: #1E3A8A;">40</td><td style="color: #1E3A8A;">$150.00</td><td style="color: #1E3A8A;">$6,000.00</td></tr>
<tr><td style="color: #1E3A8A;">Universal IR Unification</td><td style="color: #1E3A8A;">20</td><td style="color: #1E3A8A;">$150.00</td><td style="color: #1E3A8A;">$3,000.00</td></tr>
</tbody>
</table>
</div>
</body>
</html>

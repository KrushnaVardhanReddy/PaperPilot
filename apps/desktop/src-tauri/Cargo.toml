[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
paperpilot-core = { path = "../../../paperpilot-core" }
paperpilot-pdf = { path = "../../../paperpilot-pdf" }
paperpilot-mcp = { path = "../../../paperpilot-mcp", optional = true }
paperpilot-nlp = { path = "../../../paperpilot-nlp" }
paperpilot-ai = { path = "../../../paperpilot-ai" }
paperpilot-gateway = { path = "../../../paperpilot-gateway", optional = true }
tokio = { version = "1", features = ["full"] }
rmcp = { version = "3.5.0" }
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazy_static = "1.4.0"
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["stream"] }
futures-util = "0.3.34"
tokio-util = "0.7.20"
dirs = "7.0.0"
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
lopdf = "0.45.0"

[features]
default = ["desktop-features"]
desktop-features = ["dep:paperpilot-gateway", "dep:paperpilot-mcp"]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PaperPilot Embed Interactive Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f8fafc;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      margin-bottom: 32px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #38bdf8;
    }
    .back-btn {
      color: #818cf8;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 24px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="back-btn">&larr; Return to Portal</a>
    <h1>PaperPilot Embed Demonstration</h1>
    <p>Testing drop-in Shadow DOM widget integration.</p>

    <!-- Demo 1: Free Tier Embed (Badge visible) -->
    <div class="card">
      <h2>1. Standard Embed (Badge Visible)</h2>
      <div
        id="paperpilot-portal"
        data-theme="dark"
        data-tools="merge,compress,watermark,encrypt"
        data-brand-color="#5E6AD2"
      ></div>
    </div>

    <!-- Demo 2: Pro Whitelabel Embed (Badge Hidden) -->
    <div class="card">
      <h2>2. Pro Whitelabel Embed (Badge Hidden via <code>data-hide-badge="true"</code>)</h2>
      <div
        id="nobadge-portal"
        data-theme="dark"
        data-tools="merge,split,ocr,convert"
        data-brand-color="#10B981"
        data-hide-badge="true"
        data-license-key="PRO_DEMO_KEY"
      ></div>
    </div>
  </div>

  <!-- Loads the embed widget script -->
  <script src="/embed.js"></script>
</body>
</html>

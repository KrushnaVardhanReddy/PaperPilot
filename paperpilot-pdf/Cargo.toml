[package]
name = "paperpilot-pdf"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
base64 = "0.23.1"
bytemuck = "1.25.2"
calamine = { version = "0.36.1", optional = true }
csv = "1.4.0"
docx-rs = "0.4.22"
flate2 = "1.1.10"
fulgur = "0.40"
hayro = "0.8.0"
hayro-syntax = "0.8.0"
html-escape = "0.2.15"
image = { version = "0.25.6", features = ["jpeg", "png"] }
lopdf = "0.45.0"
ocrs = { version = "0.10.4", optional = true }
office_oxide = { version = "=0.1.9", optional = true }
paperpilot-core = { version = "0.1.0", path = "../paperpilot-core" }
pdf_oxide = { version = "0.3.78", default-features = false }
pulldown-cmark = "0.13.4"
regex = "1.13.1"
rten = { version = "0.21", optional = true }
rten-imageproc = { version = "0.21", optional = true }
rten-tensor = { version = "0.21", optional = true }
rust_xlsxwriter = { version = "0.99.1", optional = true }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tiny-skia = "0.12.0"
unpdf = { version = "0.46.0", default-features = false }
v_htmlescape = "0.17.0"
web-time = "1.1"
zip = "8.6.0"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"
sysinfo = "0.38.4"
tempfile = "3.27.0"

[[bench]]
name = "core_operations"
harness = false

[[bench]]
name = "concurrent_operations"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusto-rs = { version = "0.3", features = ["default"], optional = true }

[features]
default = ["office", "ocr"]
office = ["dep:office_oxide", "dep:calamine", "dep:rust_xlsxwriter"]
ocr = ["dep:rten", "dep:rten-imageproc", "dep:rten-tensor", "dep:ocrs", "dep:rusto-rs"]

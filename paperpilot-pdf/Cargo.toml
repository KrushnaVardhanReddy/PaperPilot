[package]
name = "paperpilot-pdf"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
bytemuck = "1.25.2"
calamine = "0.36.1"
csv = "1.4.0"
docx-rs = "0.4.22"
fulgur = "0.40"
hayro = "0.8.0"
hayro-syntax = "0.8.0"
html-escape = "0.2.15"
image = { version = "0.25.6", features = ["jpeg", "png"] }
lopdf = "0.45.0"
ocrs = "0.10.4"
paperpilot-core = { version = "0.1.0", path = "../paperpilot-core" }
pulldown-cmark = "0.13.4"
regex = "1.13.1"
rten = "0.21"
rten-imageproc = "0.21"
rten-tensor = "0.21"
rust_xlsxwriter = "0.99.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tiny-skia = "0.12.0"
v_htmlescape = "0.17.0"
zip = "8.6.0"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"
sysinfo = "0.38.4"
tempfile = "3.27.0"

[[bench]]
name = "core_operations"
harness = false

[[bench]]
name = "concurrent_operations"
harness = false

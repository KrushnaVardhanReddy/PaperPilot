[package]
name = "paperpilot-pdf"
version = "0.1.0"
edition = "2024"

[dependencies]
aho-corasick = "1.1.5"
docx-rs = "0.4.22"
headless_chrome = "1.0.22"
image = { version = "0.25.10", features = ["jpeg", "png"] }
lopdf = "0.45.0"
paperpilot-core = { version = "0.1.0", path = "../paperpilot-core" }
pulldown-cmark = "0.13.4"
regex = "1.13.1"
rust_xlsxwriter = "0.99.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
zip = "8.6.0"

[dev-dependencies]
proptest = "1"
tempfile = "3.27.0"

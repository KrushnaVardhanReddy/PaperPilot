[package]
name = "paperpilot-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
futures = "0.3.34"
multipart = "0.18.0"
paperpilot-core = { version = "0.1.0", path = "../paperpilot-core" }
paperpilot-mcp = { version = "0.1.0", path = "../paperpilot-mcp" }
paperpilot-nlp = { version = "0.1.0", path = "../paperpilot-nlp" }
paperpilot-pdf = { version = "0.1.0", path = "../paperpilot-pdf" }
rmcp = "3.5.0"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = "1.53.1"
tokio-stream = "0.1.19"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "tracing", "fs"] }
tracing = "0.1.44"
uuid = "1.26.1"

[package]
name = "paperpilot-gateway"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "paperpilot-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
futures = "0.3.34"
multipart = "0.18.0"
paperpilot-core = { version = "0.1.0", path = "../paperpilot-core" }
paperpilot-mcp = { version = "0.1.0", path = "../paperpilot-mcp" }
paperpilot-nlp = { version = "0.1.0", path = "../paperpilot-nlp" }
paperpilot-pdf = { version = "0.1.0", path = "../paperpilot-pdf" }
rmcp = "3.5.0"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1.19"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "tracing", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "macros"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
uuid = { version = "1.26.1", features = ["v4"] }
lopdf = "0.45.0"

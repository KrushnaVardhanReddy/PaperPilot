[package]
name = "paperpilot-gateway"
version = "0.8.2"
edition = "2024"

[[bin]]
name = "paperpilot-gateway"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
futures = "0.3.34"
paperpilot-core = { path = "../paperpilot-core" }
paperpilot-mcp = { path = "../paperpilot-mcp" }
paperpilot-nlp = { path = "../paperpilot-nlp" }
paperpilot-pdf = { path = "../paperpilot-pdf" }
rmcp = "3.9.0"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = "0.1.19"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "tracing", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "macros"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
uuid = { version = "1.26.1", features = ["v4"] }
lopdf = "0.45.0"
urlencoding = "2.1.3"
serde_urlencoded = "0.7.1"
base64 = "0.23.1"
tokio-util = { version = "0.7.20", features = ["rt"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

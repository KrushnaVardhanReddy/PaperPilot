[workspace]
members = [
    "paperpilot-core",
    "paperpilot-pdf",
    "paperpilot-cli", "paperpilot-mcp", "apps/desktop/src-tauri",
    "tools/make-fixtures"
, "paperpilot-nlp", "tools/gen-e2e-fixtures", "paperpilot-gateway", "paperpilot-wasm"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
members = [
    "paperpilot-core",
    "paperpilot-pdf",
    "paperpilot-cli", "paperpilot-mcp", "apps/desktop/src-tauri",
    "tools/make-fixtures",
    "tools/penta-interface-e2e", "tools/soak-bench"
, "paperpilot-nlp", "tools/gen-e2e-fixtures", "paperpilot-gateway", "paperpilot-wasm", "tools/jules-submit", "tools/demo-legal-fixtures", "paperpilot-ai", "tools/penta-scaffold", "paperpilot-storage", "tests/e2e"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
# Keep file and line numbers intact for panic backtraces while stripping heavy variable DWARF tables
debug = "line-tables-only"

[profile.dev.package."*"]
# Compile all third-party dependencies with opt-level 3 (fast test execution, smaller IR to link)
opt-level = 3
debug = 0


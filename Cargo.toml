[workspace]
members = [
    "paperpilot-core",
    "paperpilot-pdf",
    "paperpilot-cli", "paperpilot-mcp", "apps/desktop/src-tauri",
    "tools/make-fixtures",
    "tools/penta-interface-e2e"
, "paperpilot-nlp", "tools/gen-e2e-fixtures", "paperpilot-gateway", "paperpilot-wasm", "tools/jules-submit", "tools/demo-legal-fixtures", "paperpilot-ai"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package.rten-tensor]
opt-level = 3

[profile.dev.package.rten-imageproc]
opt-level = 3

[profile.dev.package.ocrs]
opt-level = 3

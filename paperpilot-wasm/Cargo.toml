[package]
name = "paperpilot-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
lopdf = { version = "0.45.0", default-features = false }
paperpilot-core = { path = "../paperpilot-core" }
getrandom = { version = "0.4", features = ["wasm_js"] }

[package]
name = "paperpilot-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
lopdf = { version = "0.45.0", default-features = false }
paperpilot-core = { path = "../paperpilot-core" }
getrandom = { version = "0.4", features = ["wasm_js"] }
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
flate2 = "1.1.10"
sha2 = "0.11.0"
base64 = "0.23.1"
hex = "0.4.3"

# New dependencies for 22-tools expansion
hayro = { version = "0.8.0", default-features = false }
hayro-syntax = { version = "0.8.0", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["simd", "std"] }
bytemuck = "1.25.0"
ocrs = { version = "0.10.4", default-features = false }
rten = { version = "0.21.0", default-features = false }
rten-tensor = "0.21.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
docx-rs = "0.4.22"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false



[package]
name = "paperpilot-nlp"
version = "0.1.0"
edition = "2024"

[features]
default = ["onnx"]
onnx = ["dep:ort", "dep:tokenizers", "dep:zstd", "dep:ndarray", "ort/ndarray"]

[dependencies]
aho-corasick = "1.1.5"
lazy_static = "1.5.0"
paperpilot-core = { version = "0.1.0", path = "../paperpilot-core" }
regex = "1.13.1"
thiserror = "2.0.21"
ort = { version = "2.0.0-rc.9", default-features = false, features = ["copy-dylibs", "download-binaries", "tls-rustls"], optional = true }
tokenizers = { version = "0.21.0", default-features = false, features = ["onig"], optional = true }
zstd = { version = "0.13.2", optional = true }
ndarray = { version = "0.17.2", optional = true }
serde_json = "1.0.151"

[dev-dependencies]
paperpilot-mcp = { path = "../paperpilot-mcp" }
lopdf = "0.45.0"
serde_json = "1.0.151"
rmcp = "3.5.0"
criterion = "0.8.2"

[[bench]]
name = "nlp_resolver"
harness = false
